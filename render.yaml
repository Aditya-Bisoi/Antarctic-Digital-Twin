services:
  # ========================================================
  # 1. Django REST Backend (Python Web Service)
  # ========================================================
  - type: web
    name: antarctic-digital-twin-backend
    runtime: python
    rootDir: remix-antarctic-digital-twin/backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn config.wsgi:application
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"

  # ========================================================
  # 2. React + Vite Frontend (Static Site)
  # ========================================================
  - type: web
    name: antarctic-digital-twin-frontend
    runtime: static
    rootDir: remix-antarctic-digital-twin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
